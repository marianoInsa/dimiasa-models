[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dimiasa_models"
version = "0.0.1"
description = "Analizar los modelos inteligentes y ciencia de datos para usar en los modelos de IoT."
authors = [
  { name = "Centro de Investigaci\u00f3n Aplicada en Tecnolog\u00edas de la Informaci\u00f3n y la Comunicaci\u00f3n (CInApTIC)" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "azure-storage-file-datalake>=12.25.0",
    "dtaidistance>=2.4.0",
    "greenlet>=3.0.0",
    "matplotlib>=3.9.0",
    "mkdocs",
    "neurokit2>=0.2.13",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pip",
    "pyarrow>=25.0.0",
    "pyppg>=1.0.14",
    "pytest>=9.0.3",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "tensorflow>=2.18.0",
    "wfdb>=4.3.1",
]
requires-python = ">=3.10, <3.14"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]


[tool.ruff]
line-length = 99
src = ["dimiasa_models"]
include = ["pyproject.toml", "dimiasa_models/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["dimiasa_models"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests que requieren TF fit completo (excluir con -m 'not slow')",
]
